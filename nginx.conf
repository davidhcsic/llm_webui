map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/webui.crt;
    ssl_certificate_key /etc/nginx/certs/webui.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # If accessed via plain HTTP on port 3000, redirect seamlessly to HTTPS
    error_page 497 https://$http_host$request_uri;

    client_max_body_size 100M;

    location / {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Disable buffering for real-time LLM token streaming
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
