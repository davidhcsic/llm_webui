# Local Open WebUI → IIIA Qwen gateway (self-hosted). Secrets stay in .env (gitignored).
name: iiia-qwen-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.12.4
    container_name: iiia-qwen-open-webui
    restart: unless-stopped
    expose:
      - "8080"
    ports:
      # Optional local loopback access for plain HTTP debugging
      - "127.0.0.1:3080:8080"
    env_file:
      - .env
    environment:
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: "false"
      ENABLE_OLLAMA_API: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
      ANONYMIZED_TELEMETRY: "false"
      OFFLINE_MODE: "false"
      AUDIO_STT_ENGINE: "faster-whisper"
      WHISPER_MODEL: "base"
      WHISPER_COMPUTE_TYPE: "int8"
    volumes:
      - open-webui-data:/app/backend/data

  webui-proxy:
    image: docker.io/library/nginx:alpine
    container_name: iiia-qwen-webui-proxy
    restart: unless-stopped
    ports:
      # HTTPS entrypoint on port 3000 (all interfaces for LAN clients)
      - "0.0.0.0:3000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./certs:/etc/nginx/certs:ro,Z
    depends_on:
      - open-webui

volumes:
  open-webui-data:
